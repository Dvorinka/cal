openapi: 3.1.0
info:
  title: Cal API
  version: 0.2.0
  description: Self-hosted minimal planner — entries, settings, holidays, cookie-session auth.
servers:
  - url: http://localhost:8080/api
paths:
  /health:
    get:
      responses:
        "200":
          description: API status
  /auth/register:
    post:
      description: Register an account. Rate-limited to 8 attempts per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          description: Too many attempts
  /auth/login:
    post:
      description: Log in. Rate-limited to 8 attempts per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      responses:
        "204":
          description: Session cleared
  /me:
    get:
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /entries:
    get:
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Case-insensitive title/content match, or exact tag match. When set without a range, all dates are searched.
          schema:
            type: string
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid entry (bad date/time order, recur on non-task, missing title)
  /entries/{id}:
    patch:
      description: Partial update. Completing a recurring task spawns the next occurrence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryPatch"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /settings:
    get:
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /feeds:
    get:
      summary: List subscribed external calendar feeds
      responses:
        "200":
          description: Feeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
    post:
      summary: Subscribe to an iCalendar feed URL. The URL is fetched and validated immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                color:
                  type: string
      responses:
        "201":
          description: Subscribed feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: Not a valid iCalendar feed
        "502":
          description: Feed URL could not be fetched
  /feeds/{id}:
    delete:
      responses:
        "204":
          description: Feed removed
  /feeds/{id}/refresh:
    post:
      summary: Re-fetch the feed's ICS body now
      responses:
        "204":
          description: Refreshed
        "502":
          description: Feed URL could not be fetched
  /feed-events:
    get:
      summary: Expanded occurrences from all subscribed feeds in a date range (read-only)
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: External events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedEvent"
  /import:
    post:
      summary: Import a .ics file; each VEVENT becomes an `event` entry (recurring rules flatten to occurrences within ±1 year)
      requestBody:
        required: true
        content:
          text/calendar:
            schema:
              type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        "400":
          description: No events found
  /settings/widget-token:
    post:
      summary: Rotate the read-only widget share token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  widgetToken:
                    type: string
  /settings/api-token:
    post:
      summary: Rotate the MCP/API access token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiToken:
                    type: string
  /widget/today:
    get:
      summary: Token-gated read-only agenda for the embeddable widget
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Today's entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
        "401":
          description: Invalid token
  /mcp:
    post:
      summary: Model Context Protocol endpoint (JSON-RPC 2.0 over HTTP). Auth via `Authorization: Bearer <apiToken>`. Supports initialize, ping, tools/list, tools/call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: JSON-RPC response
        "401":
          description: Invalid API token
  /caldav:
    get:
      summary: List connected CalDAV calendar accounts
      responses:
        "200":
          description: Accounts (passwords never leave the server)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaldavAccount"
    post:
      summary: Connect a CalDAV collection (verified before saving; password AES-encrypted at rest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                name:
                  type: string
                url:
                  type: string
                  description: Calendar collection URL
                username:
                  type: string
                password:
                  type: string
                color:
                  type: string
      responses:
        "201":
          description: Connected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaldavAccount"
        "502":
          description: Could not reach or authenticate the server
  /caldav/test:
    post:
      summary: Probe credentials without saving
      responses:
        "204":
          description: Connection OK
        "502":
          description: Connection failed
  /caldav/{id}:
    delete:
      summary: Disconnect; synced entries are removed locally
      responses:
        "204":
          description: Removed
  /caldav/{id}/sync:
    post:
      summary: Force a two-way sync (push dirty changes, pull remote changes)
      responses:
        "204":
          description: Synced
        "502":
          description: Remote unreachable
  /push/vapid:
    get:
      responses:
        "200":
          description: VAPID public key for pushManager.subscribe
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey:
                    type: string
  /push/subscribe:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                keys:
                  type: object
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
      responses:
        "204":
          description: Subscription stored
  /push/unsubscribe:
    post:
      responses:
        "204":
          description: Subscription removed
  /export:
    get:
      summary: Download all user data as JSON
      responses:
        "200":
          description: Full export (user, settings, entries)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  user:
                    $ref: "#/components/schemas/User"
                  settings:
                    $ref: "#/components/schemas/Settings"
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entry"
  /holidays:
    get:
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Holidays for the country/year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
        "400":
          description: Unknown country or invalid year
  /holidays/countries:
    get:
      responses:
        "200":
          description: Supported holiday regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
components:
  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
    Entry:
      type: object
      required: [id, title, type, date, completed, color, tags, recur, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: HH:MM 24h; absent for untimed/all-day entries
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Must be after startTime when both are set
        completed:
          type: boolean
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
        remind:
          type: integer
          description: Minutes before startTime to fire a reminder; absent = none
        createdAt:
          type: string
          format: date-time
    EntryInput:
      type: object
      required: [title, type, date]
      properties:
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
          description: Only valid for type=task
        remind:
          type: integer
          nullable: true
    EntryPatch:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        completed:
          type: boolean
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
        remind:
          type: integer
          nullable: true
    Settings:
      type: object
      required: [country, showHolidays, theme, weekStart]
      properties:
        country:
          type: string
        showHolidays:
          type: boolean
        theme:
          enum: [light, dark, system]
        weekStart:
          enum: [monday, sunday]
        accent:
          enum: [green, blue, violet, amber, rose]
        widgetToken:
          type: string
          description: Read-only token for the embeddable Today widget
        apiToken:
          type: string
          description: Full-access bearer token for the MCP endpoint
    Feed:
      type: object
      required: [id, name, url, color]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        color:
          type: string
        fetchedAt:
          type: string
          format: date-time
    CaldavAccount:
      type: object
      required: [id, name, url, username, color]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        username:
          type: string
        color:
          type: string
        lastSynced:
          type: string
          format: date-time
    FeedEvent:
      type: object
      required: [id, feedId, feedName, title, date, color]
      properties:
        id:
          type: string
        feedId:
          type: string
        feedName:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        color:
          type: string
        location:
          type: string
        url:
          type: string
        details:
          type: string
    Holiday:
      type: object
      required: [id, name, date, country]
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
          format: date
        country:
          type: string
    Country:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
