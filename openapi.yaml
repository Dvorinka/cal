openapi: 3.1.0
info:
  title: Cal API
  version: 0.2.0
  description: Self-hosted minimal planner — entries, settings, holidays, cookie-session auth.
servers:
  - url: http://localhost:8080/api
paths:
  /health:
    get:
      responses:
        "200":
          description: API status
  /auth/register:
    post:
      description: Register an account. Rate-limited to 8 attempts per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          description: Too many attempts
  /auth/login:
    post:
      description: Log in. Rate-limited to 8 attempts per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      responses:
        "204":
          description: Session cleared
  /me:
    get:
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /entries:
    get:
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Case-insensitive title/content match, or exact tag match. When set without a range, all dates are searched.
          schema:
            type: string
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid entry (bad date/time order, recur on non-task, missing title)
  /entries/{id}:
    patch:
      description: Partial update. Completing a recurring task spawns the next occurrence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryPatch"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /settings:
    get:
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /holidays:
    get:
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Holidays for the country/year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
        "400":
          description: Unknown country or invalid year
  /holidays/countries:
    get:
      responses:
        "200":
          description: Supported holiday regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
components:
  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
    Entry:
      type: object
      required: [id, title, type, date, completed, color, tags, recur, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: HH:MM 24h; absent for untimed/all-day entries
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Must be after startTime when both are set
        completed:
          type: boolean
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
        createdAt:
          type: string
          format: date-time
    EntryInput:
      type: object
      required: [title, type, date]
      properties:
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
          description: Only valid for type=task
    EntryPatch:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        completed:
          type: boolean
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
    Settings:
      type: object
      required: [country, showHolidays, theme, weekStart]
      properties:
        country:
          type: string
        showHolidays:
          type: boolean
        theme:
          enum: [light, dark, system]
        weekStart:
          enum: [monday, sunday]
    Holiday:
      type: object
      required: [id, name, date, country]
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
          format: date
        country:
          type: string
    Country:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
