openapi: 3.1.0
info:
  title: Cal API
  version: 0.2.0
  description: Self-hosted minimal planner — entries, settings, holidays, cookie-session auth.
servers:
  - url: http://localhost:8080/api
paths:
  /health:
    get:
      responses:
        "200":
          description: API status
  /auth/register:
    post:
      description: Register an account. Rate-limited to 8 attempts per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          description: Too many attempts
  /auth/login:
    post:
      description: Log in. Rate-limited to 8 attempts per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      responses:
        "204":
          description: Session cleared
  /me:
    get:
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /entries:
    get:
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Case-insensitive title/content match, or exact tag match. When set without a range, all dates are searched.
          schema:
            type: string
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid entry (bad date/time order, recur on non-task, missing title)
  /entries/{id}:
    patch:
      description: Partial update. Completing a recurring task spawns the next occurrence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryPatch"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /settings:
    get:
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /feeds:
    get:
      summary: List subscribed external calendar feeds
      responses:
        "200":
          description: Feeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
    post:
      summary: Subscribe to an iCalendar feed URL. The URL is fetched and validated immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                color:
                  type: string
      responses:
        "201":
          description: Subscribed feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: Not a valid iCalendar feed
        "502":
          description: Feed URL could not be fetched
  /feeds/{id}:
    delete:
      responses:
        "204":
          description: Feed removed
  /feeds/{id}/refresh:
    post:
      summary: Re-fetch the feed's ICS body now
      responses:
        "204":
          description: Refreshed
        "502":
          description: Feed URL could not be fetched
  /feed-events:
    get:
      summary: Expanded occurrences from all subscribed feeds in a date range (read-only)
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: External events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedEvent"
  /import:
    post:
      summary: Import a .ics file; each VEVENT becomes an `event` entry (recurring rules flatten to occurrences within ±1 year)
      requestBody:
        required: true
        content:
          text/calendar:
            schema:
              type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        "400":
          description: No events found
  /settings/widget-token:
    post:
      summary: Rotate the read-only widget share token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  widgetToken:
                    type: string
  /settings/api-token:
    post:
      summary: Rotate the MCP/API access token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiToken:
                    type: string
  /widget/today:
    get:
      summary: Token-gated read-only agenda for the embeddable widget
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Today's entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
        "401":
          description: Invalid token
  /mcp:
    post:
      summary: Model Context Protocol endpoint (JSON-RPC 2.0 over HTTP). Auth via `Authorization: Bearer <apiToken>`. Supports initialize, ping, tools/list, tools/call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: JSON-RPC response
        "401":
          description: Invalid API token
  /caldav:
    get:
      summary: List connected CalDAV calendar accounts
      responses:
        "200":
          description: Accounts (passwords never leave the server)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaldavAccount"
    post:
      summary: Connect a CalDAV collection (verified before saving; password AES-encrypted at rest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                name:
                  type: string
                url:
                  type: string
                  description: Calendar collection URL
                username:
                  type: string
                password:
                  type: string
                color:
                  type: string
      responses:
        "201":
          description: Connected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaldavAccount"
        "502":
          description: Could not reach or authenticate the server
  /caldav/test:
    post:
      summary: Probe credentials without saving
      responses:
        "204":
          description: Connection OK
        "502":
          description: Connection failed
  /caldav/{id}:
    delete:
      summary: Disconnect; synced entries are removed locally
      responses:
        "204":
          description: Removed
  /caldav/{id}/sync:
    post:
      summary: Force a two-way sync (push dirty changes, pull remote changes)
      responses:
        "204":
          description: Synced
        "502":
          description: Remote unreachable
  /feed.ics:
    get:
      summary: Subscribable .ics feed of own tasks/events (widget token auth)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: VCALENDAR of the user's tasks and events
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Invalid token
  /restore:
    post:
      summary: Merge an export file back into the account (additive)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items:
                    $ref: "#/components/schemas/Entry"
      responses:
        "200":
          description: Number of restored entries
  /sessions:
    get:
      summary: List active sessions
      responses:
        "200":
          description: Sessions (current flagged)
  /sessions/{id}:
    delete:
      summary: Revoke a session
      responses:
        "204":
          description: Revoked
  /password:
    post:
      summary: Change password; revokes other sessions
      responses:
        "204":
          description: Changed
        "403":
          description: Wrong current password
  /entries/{id}/revisions:
    get:
      summary: Point-in-time snapshots of an entry (newest first, ≤50)
      responses:
        "200":
          description: Revision list
  /entries/{id}/restore/{rev}:
    post:
      summary: Restore a revision onto the entry (snapshots current state first)
      responses:
        "204":
          description: Restored
        "404":
          description: Revision not found
  /review/week:
    get:
      summary: Weekly digest — done/slipped/notes/streak/busiest
      responses:
        "200":
          description: WeekReview
  /habits:
    get:
      summary: Streaks for recurring #habit-tagged tasks
      responses:
        "200":
          description: Habit list with streak counts
  /unfurl:
    get:
      summary: Fetch a link's title/description/favicon (SSRF-guarded)
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page metadata
        "400":
          description: Invalid or private URL
  /files:
    post:
      summary: Upload an attachment (≤20 MB, multipart 'file')
      responses:
        "200":
          description: "{url, name, markdown} — markdown is a ![alt](url) snippet"
  /files:
    get:
      summary: List uploaded files
    post:
      summary: Upload a file (multipart, 20 MB, quota-enforced)
  /files/{id}:
    delete:
      summary: Delete a file
  /files/{id}/share:
    post:
      summary: Toggle a public share token {on}
  /shared/files/{token}:
    get:
      summary: Public share download (no auth)
  /boards:
    get:
      summary: List kanban boards
    post:
      summary: Create a board
  /boards/{id}/view:
    get:
      summary: Board columns + cards
  /boards/{id}/columns:
    post:
      summary: Add a column
  /columns/{id}:
    patch:
      summary: Rename a column
    delete:
      summary: Delete a column
  /cards/{id}/move:
    post:
      summary: Move card to column at fractional position
  /timer/start:
    post:
      summary: Start the running focus timer {entryId?, note?}
  /timer/stop:
    post:
      summary: Stop the running timer
  /timer/current:
    get:
      summary: Running timer or 204
  /time/summary:
    get:
      summary: todayMinutes, weekMinutes, perEntry
  /entries/{id}/activity:
    get:
      summary: Card activity log
  /trash:
    get:
      summary: Soft-deleted entries
  /trash/{id}/restore:
    post:
      summary: Restore a trashed entry
  /trash/{id}:
    delete:
      summary: Purge a trashed entry permanently
  /boards/{id}/share:
    post:
      summary: Toggle a public board share token {on}
  /shared/boards/{token}:
    get:
      summary: Public board columns + cards (no auth)
  /tags:
    get:
      summary: Tag -> entry count map
  /agenda:
    get:
      summary: Markdown agenda for ?days=N (1-60)
  /time/log:
    get:
      summary: Finished sessions in ?from&to
  /time/log/{id}:
    delete:
      summary: Delete a session
  /time/export:
    get:
      summary: solidtime-shaped CSV or JSON (?format=) of sessions
  /search:
    get:
      summary: Global search — entries + files
  /github/inbox:
    get:
      summary: Open issues+PRs involving the user (needs settings.githubToken)
  /github/activity:
    get:
      summary: Login + events this week
  /github/import:
    post:
      summary: Import an issue/PR url as a board card {url, boardId?, columnId?}
  /activity:
    get:
      summary: Date -> entry count map, last 120 days
  /files/{name}:
    get:
      summary: Serve a caller-owned attachment
      responses:
        "200":
          description: File bytes
        "404":
          description: Not found / not owned
  /webhooks:
    get:
      summary: List outbound webhooks
    post:
      summary: Register a webhook (HMAC secret returned)
      responses:
        "201":
          description: Created
  /webhooks/{id}:
    delete:
      summary: Remove a webhook
  /intake:
    post:
      summary: "Email-to-task intake — {subject, text?, date?} → task"
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: API token (settings.apiToken)
      responses:
        "201":
          description: Task created
  /caldav/discover:
    post:
      summary: List calendar collections under a base URL (principal → home-set)
      responses:
        "200":
          description: "[{href, name}]"
  /carddav:
    post:
      summary: Connect an addressbook and import BDAY contacts as yearly events
      responses:
        "201":
          description: "{imported, found}"
  /carddav/{id}/sync:
    post:
      summary: Re-pull birthdays for a CardDAV account
  /carddav/{id}:
    delete:
      summary: Disconnect a CardDAV account
  /google/connect:
    get:
      summary: Google OAuth consent URL (requires GOOGLE_CLIENT_ID/SECRET env)
      responses:
        "200":
          description: "{url}"
        "501":
          description: Not configured
  /google/callback:
    get:
      summary: OAuth redirect — exchanges code, stores tokens, syncs, redirects to /settings
  /google/status:
    get:
      summary: "{connected: bool}"
  /google/sync:
    post:
      summary: Force a Google Calendar sync
  /google:
    delete:
      summary: Disconnect Google (removes tokens + synthetic feed)
  /push/subscriptions:
    get:
      summary: List push devices (label + endpoint tail)
    responses:
      "200":
        description: devices
  /push/subscriptions/{id}:
    delete:
      summary: Revoke one device
  /push/vapid:
    get:
      responses:
        "200":
          description: VAPID public key for pushManager.subscribe
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey:
                    type: string
  /push/subscribe:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                keys:
                  type: object
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
      responses:
        "204":
          description: Subscription stored
  /push/unsubscribe:
    post:
      responses:
        "204":
          description: Subscription removed
  /export:
    get:
      summary: Download all user data as JSON
      responses:
        "200":
          description: Full export (user, settings, entries)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  user:
                    $ref: "#/components/schemas/User"
                  settings:
                    $ref: "#/components/schemas/Settings"
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entry"
  /holidays:
    get:
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Holidays for the country/year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
        "400":
          description: Unknown country or invalid year
  /holidays/countries:
    get:
      responses:
        "200":
          description: Supported holiday regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
components:
  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
    Entry:
      type: object
      required: [id, title, type, date, completed, color, tags, recur, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: HH:MM 24h; absent for untimed/all-day entries
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Must be after startTime when both are set
        completed:
          type: boolean
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
        remind:
          type: integer
          description: Minutes before startTime to fire a reminder; absent = none
        createdAt:
          type: string
          format: date-time
    EntryInput:
      type: object
      required: [title, type, date]
      properties:
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
          description: Only valid for type=task
        remind:
          type: integer
          nullable: true
    EntryPatch:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        completed:
          type: boolean
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
        remind:
          type: integer
          nullable: true
    Settings:
      type: object
      required: [country, showHolidays, theme, weekStart]
      properties:
        country:
          type: string
        showHolidays:
          type: boolean
        theme:
          enum: [light, dark, system]
        weekStart:
          enum: [monday, sunday]
        accent:
          enum: [green, blue, violet, amber, rose]
        widgetToken:
          type: string
          description: Read-only token for the embeddable Today widget
        apiToken:
          type: string
          description: Full-access bearer token for the MCP endpoint
    Feed:
      type: object
      required: [id, name, url, color]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        color:
          type: string
        fetchedAt:
          type: string
          format: date-time
    CaldavAccount:
      type: object
      required: [id, name, url, username, color]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        username:
          type: string
        color:
          type: string
        lastSynced:
          type: string
          format: date-time
    FeedEvent:
      type: object
      required: [id, feedId, feedName, title, date, color]
      properties:
        id:
          type: string
        feedId:
          type: string
        feedName:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        color:
          type: string
        location:
          type: string
        url:
          type: string
        details:
          type: string
    Holiday:
      type: object
      required: [id, name, date, country]
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
          format: date
        country:
          type: string
    Country:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
