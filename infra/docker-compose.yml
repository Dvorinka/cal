services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cal
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: cal
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - cal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal -d cal"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://cal:cal@db:5432/cal?sslmode=disable
      SESSION_SECURE: "false"
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5173}
      PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  cal-db:
