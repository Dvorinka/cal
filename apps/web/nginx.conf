server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. CSP: app is a Vite SPA — scripts self-only, styles need
  # 'unsafe-inline' for style= attributes, images allow https for unfurled
  # favicons, connect-src adds the keyless Open-Meteo endpoints.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' data:;
    connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com;
    frame-ancestors 'self';
    base-uri 'self';
    form-action 'self'
  " always;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service worker must never be cached stale.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
