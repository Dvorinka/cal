<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cal — starting</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: #151513; color: #e8e6de;
    font-family: system-ui, "Segoe UI", sans-serif;
  }
  main { text-align: center; max-width: 34rem; padding: 2rem; }
  svg { width: 72px; height: 72px; }
  h1 { font-size: 1.4rem; font-weight: 600; margin: 1.1rem 0 .4rem; letter-spacing: .01em; }
  #detail { color: #9a978c; font-size: .92rem; min-height: 1.4em; }
  #spin {
    width: 26px; height: 26px; margin: 1.4rem auto 0;
    border: 2px solid #3a382f; border-top-color: #2f7d4f;
    border-radius: 50%; animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  #error { display: none; text-align: left; }
  #error .box {
    background: #231d1a; border: 1px solid #4d3226; border-radius: 10px;
    padding: .9rem 1rem; margin-top: 1rem; font-size: .82rem;
    color: #e0b8a4; word-break: break-word; white-space: pre-wrap;
    font-family: ui-monospace, Consolas, monospace; max-height: 14rem; overflow: auto;
  }
  #error .log { color: #9a978c; font-size: .8rem; margin-top: .7rem; word-break: break-all; }
  #retry {
    margin-top: 1.1rem; padding: .55rem 1.6rem; border: 0; border-radius: 8px;
    background: #2f7d4f; color: #f6f5f0; font-size: .9rem; font-weight: 600;
    cursor: pointer;
  }
  #retry:hover { background: #37925e; }
  #retry:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="16" fill="#2f7d4f"/>
    <rect x="15" y="15" width="34" height="34" rx="5" fill="#f6f5f0"/>
    <rect x="15" y="15" width="34" height="10" rx="5" fill="#1d1c18" fill-opacity="0.18"/>
    <rect x="19" y="18.5" width="26" height="3" rx="1.5" fill="#f6f5f0" fill-opacity="0.85"/>
    <rect x="20" y="30" width="7" height="7" rx="2" fill="#1d1c18" fill-opacity="0.55"/>
    <rect x="30" y="30" width="7" height="7" rx="2" fill="#1d1c18" fill-opacity="0.55"/>
    <rect x="40" y="30" width="7" height="7" rx="2" fill="#1d1c18" fill-opacity="0.55"/>
    <rect x="20" y="40" width="7" height="7" rx="2" fill="#1d1c18" fill-opacity="0.55"/>
    <rect x="30" y="40" width="7" height="7" rx="2" fill="#2f7d4f"/>
    <rect x="40" y="40" width="7" height="7" rx="2" fill="#1d1c18" fill-opacity="0.55"/>
  </svg>
  <h1>Cal is getting ready</h1>
  <p id="detail">Starting…</p>
  <div id="spin" role="progressbar" aria-label="Loading"></div>
  <div id="error">
    <div class="box" id="errmsg"></div>
    <p class="log">Log file: <span id="logpath"></span></p>
    <button id="retry" type="button">Try again</button>
  </div>
</main>
<script src="/__setup/setup.js"></script>
</body>
</html>
