version: 2
updates:
  - package-ecosystem: npm
    # Workspaces share the root package-lock.json; scanning subdirectories
    # produces manifest-only PRs that npm ci can never install.
    directories: ["/"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directories: ["/apps/api", "/apps/desktop"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
