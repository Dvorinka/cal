version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/apps/web", "/packages/api-client"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directories: ["/apps/api", "/apps/desktop"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
