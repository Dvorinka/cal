name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: go vet ./...
        working-directory: apps/api
      - run: go test ./...
        working-directory: apps/api

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      # Headless variant compiles without webkit headers; wails build is
      # a release step, not CI.
      - run: go vet -tags headless ./...
        working-directory: apps/desktop
      - run: go build -tags headless ./...
        working-directory: apps/desktop
