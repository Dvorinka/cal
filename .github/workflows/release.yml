name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  WAILS_VERSION: v2.15.0

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, ext: "", label: linux-amd64 }
          - { os: windows-latest, ext: ".exe", label: windows-amd64 }
          - { os: macos-latest, ext: "", label: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # Signing is opt-in: the steps below run only when the secrets exist.
      # See docs/releasing.md for what each secret is and how to produce it.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: npm ci

      - name: Resolve version
        working-directory: apps/desktop
        shell: bash
        # Tag pushes give "v1.2.3" → "1.2.3"; workflow_dispatch on a branch
        # falls back to wails.json productVersion.
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || V=$(node -p "require('./wails.json').info.productVersion")
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Webkit deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop app
        working-directory: apps/desktop
        # webkit2_41 tag: Ubuntu 24.04+ ships webkit2gtk-4.1 only
        run: wails build -clean ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }}

      - name: Build headless server binary
        working-directory: apps/desktop
        run: go build -tags headless -o build/bin/cal-server${{ matrix.ext }} .

      - name: Install nfpm (Linux)
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      # windows-latest ships signtool via the bundled Windows SDK. The exe is
      # signed before the MSI wraps it, then the MSI itself is signed.
      - name: Sign & package (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD build/bin/cal.exe
          }
          # v7 requires accepting the OSMF EULA; v6 does not.
          dotnet tool install --global wix --version 6.0.2
          Copy-Item build/bin/cal.exe "build/bin/cal-desktop-${{ matrix.label }}.exe"
          wix build build/windows/cal.wxs -arch x64 -d "BinDir=$PWD/build/bin" -d "ProductVersion=$env:VERSION" -o "build/bin/cal-desktop-${{ matrix.label }}.msi"
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD "build/bin/cal-desktop-${{ matrix.label }}.msi"
            Remove-Item cert.pfx
          }
          Move-Item build/bin/cal-server.exe "build/bin/cal-server-${{ matrix.label }}.exe"

      # Developer ID Application cert → codesign, then notarize + staple so
      # Gatekeeper opens the app without the right-click dance.
      - name: Sign & notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_BASE64 != ''
        working-directory: apps/desktop/build/bin
        run: |
          set -euo pipefail
          KEYCHAIN=build-sign.keychain-db
          security create-keychain -p "" $KEYCHAIN
          security set-keychain-settings $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          codesign --deep --force --options runtime --timestamp --sign "$IDENTITY" cal.app
          ditto -c -k --keepParent cal.app cal-notarize.zip
          xcrun notarytool submit cal-notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple cal.app
          rm cal-notarize.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          nfpm package -f build/linux/nfpm.yaml -p deb -t "build/bin/cal-desktop-${{ matrix.label }}.deb"
          nfpm package -f build/linux/nfpm.yaml -p rpm -t "build/bin/cal-desktop-${{ matrix.label }}.rpm"
          # AppImage: appimagetool is itself an AppImage; --appimage-extract
          # sidesteps the missing FUSE on GH runners.
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          (cd /tmp && /tmp/appimagetool --appimage-extract >/dev/null)
          mkdir build/bin/AppDir
          install -m755 build/bin/cal build/bin/AppDir/AppRun
          install -m644 build/linux/cal.desktop build/linux/cal.png build/bin/AppDir/
          (cd build/bin && ARCH=x86_64 /tmp/squashfs-root/AppRun AppDir "cal-desktop-${{ matrix.label }}.AppImage")
          # headless server ships as a bare binary
          mv "build/bin/cal-server${{ matrix.ext }}" "build/bin/cal-server-${{ matrix.label }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/build/bin
        run: |
          hdiutil create -volname Cal -srcfolder cal.app -ov -format UDZO "cal-desktop-${{ matrix.label }}.dmg"
          mv cal-server "cal-server-${{ matrix.label }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cal-${{ matrix.label }}
          path: apps/desktop/build/bin/cal-*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/desktop/build/bin/cal-*
