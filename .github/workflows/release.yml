name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  WAILS_VERSION: v2.10.2

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, archive: tar.gz, ext: "", label: linux-amd64 }
          - { os: windows-latest, archive: zip, ext: ".exe", label: windows-amd64 }
          - { os: macos-latest, archive: zip, ext: "", label: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - run: npm ci

      - name: Webkit deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop app
        working-directory: apps/desktop
        run: wails build -clean

      - name: Build headless server binary
        working-directory: apps/desktop
        run: go build -tags headless -o build/bin/cal-server${{ matrix.ext }} .

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/build/bin
        run: |
          tar czf cal-desktop-${{ matrix.label }}.tar.gz cal${{ matrix.ext }}
          tar czf cal-server-${{ matrix.label }}.tar.gz cal-server${{ matrix.ext }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/build/bin
        shell: pwsh
        run: |
          Compress-Archive cal${{ matrix.ext }} cal-desktop-${{ matrix.label }}.zip
          Compress-Archive cal-server${{ matrix.ext }} cal-server-${{ matrix.label }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/build/bin
        run: |
          zip -qr cal-desktop-${{ matrix.label }}.zip cal.app
          zip -q cal-server-${{ matrix.label }}.zip cal-server

      - uses: actions/upload-artifact@v4
        with:
          name: cal-${{ matrix.label }}
          path: apps/desktop/build/bin/cal-*.${{ matrix.archive }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/build/bin/cal-*.${{ matrix.archive }}
