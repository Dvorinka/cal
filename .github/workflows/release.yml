name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  WAILS_VERSION: v2.15.0

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, archive: tar.gz, ext: "", label: linux-amd64 }
          - { os: windows-latest, archive: zip, ext: ".exe", label: windows-amd64 }
          - { os: macos-latest, archive: zip, ext: "", label: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # Signing is opt-in: the steps below run only when the secrets exist.
      # See docs/releasing.md for what each secret is and how to produce it.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: npm ci

      - name: Webkit deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop app
        working-directory: apps/desktop
        # webkit2_41 tag: Ubuntu 24.04+ ships webkit2gtk-4.1 only
        run: wails build -clean ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }}

      - name: Build headless server binary
        working-directory: apps/desktop
        run: go build -tags headless -o build/bin/cal-server${{ matrix.ext }} .

      # windows-latest ships signtool via the bundled Windows SDK.
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
        working-directory: apps/desktop/build/bin
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$PWD/cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD cal.exe
          Remove-Item cert.pfx

      # Developer ID Application cert → codesign, then notarize + staple so
      # Gatekeeper opens the app without the right-click dance.
      - name: Sign & notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_BASE64 != ''
        working-directory: apps/desktop/build/bin
        run: |
          set -euo pipefail
          KEYCHAIN=build-sign.keychain-db
          security create-keychain -p "" $KEYCHAIN
          security set-keychain-settings $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          codesign --deep --force --options runtime --timestamp --sign "$IDENTITY" cal.app
          ditto -c -k --keepParent cal.app cal-notarize.zip
          xcrun notarytool submit cal-notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple cal.app
          rm cal-notarize.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/build/bin
        run: |
          cp ../linux/cal.desktop ../linux/cal.png ../linux/install.sh .
          chmod +x install.sh
          tar czf cal-desktop-${{ matrix.label }}.tar.gz cal${{ matrix.ext }} cal.desktop cal.png install.sh
          tar czf cal-server-${{ matrix.label }}.tar.gz cal-server${{ matrix.ext }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/build/bin
        shell: pwsh
        run: |
          Compress-Archive cal${{ matrix.ext }} cal-desktop-${{ matrix.label }}.zip
          Compress-Archive cal-server${{ matrix.ext }} cal-server-${{ matrix.label }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/build/bin
        run: |
          zip -qr cal-desktop-${{ matrix.label }}.zip cal.app
          zip -q cal-server-${{ matrix.label }}.zip cal-server

      - uses: actions/upload-artifact@v7
        with:
          name: cal-${{ matrix.label }}
          path: apps/desktop/build/bin/cal-*.${{ matrix.archive }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/desktop/build/bin/cal-*.${{ matrix.archive }}
