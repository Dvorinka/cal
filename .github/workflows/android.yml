name: android-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps + build web
        run: |
          npm ci
          npm run build -w @cal/api-client
          npm run build -w apps/web

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p apps/web/android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > apps/web/android/app/keystore/cal-release.jks

      - name: Assemble signed release
        working-directory: apps/web/android
        env:
          CAL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAL_KEY_ALIAS: cal
          CAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cal-release-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
