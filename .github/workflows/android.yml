name: Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  apk:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          mkdir -p "$HOME/android-sdk/licenses"
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a1c10e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$HOME/android-sdk/licenses/android-sdk-license"
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install deps, build web, sync Capacitor
        run: |
          npm ci
          npm run android:sync -w @cal/web

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p apps/web/android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > apps/web/android/app/keystore/cal-release.jks

      - name: Assemble signed release
        if: env.KEYSTORE_BASE64 != ''
        working-directory: apps/web/android
        env:
          CAL_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Assemble debug APK (unsigned secrets absent)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

      # Give the APK a human name: app-debug.apk / app-release.apk tell users
      # nothing. Debug stays labelled debug — it's unsigned and unoptimized.
      - name: Rename APK for release
        run: |
          cd apps/web/android/app/build/outputs/apk
          if [ -f release/app-release.apk ]; then
            mv release/app-release.apk Cal-Android.apk
          elif [ -f debug/app-debug.apk ]; then
            mv debug/app-debug.apk Cal-Android-debug.apk
          else
            # Unexpected output name (e.g. unsigned release) — take whatever
            # assemble produced rather than failing the release.
            f=$(find . -name '*.apk' | head -1)
            mv "$f" Cal-Android.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: cal-apk
          path: apps/web/android/app/build/outputs/apk/**/Cal-*.apk
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/web/android/app/build/outputs/apk/**/Cal-*.apk
