name: Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install deps, build web, sync Capacitor
        run: |
          npm ci
          npm run android:sync -w @cal/web

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p apps/web/android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > apps/web/android/app/keystore/cal-release.jks

      - name: Assemble signed release
        if: env.KEYSTORE_BASE64 != ''
        working-directory: apps/web/android
        env:
          CAL_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Assemble debug APK (unsigned secrets absent)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: cal-apk
          path: apps/web/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/web/android/app/build/outputs/apk/**/*.apk
